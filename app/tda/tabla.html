<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>contador qlcsmlawia</title>
   <script src="{{module_path}}/a.js"></script>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
   <script>
      const module_path = '{{module_path}}';
   </script>
   <style>
      [x-cloak]{display: none;}
      button {
         height: 42px;
         margin: 11px;
      }
      .update {
         background: lightcoral;
      }
      .movit {
         width: 42px;
      }
      .input {
         padding: 7px;
         border-style: solid;
      }
   </style>
</head>
<body
   x-data="{
      players: {{!jugadores}},
      player: '{{jugador}}',
      player2: '',
      gold: {{gold}},
      deuda: {{debt}},
      abuso: 0,
      gold_taken: 0,
      stakes: {{stakes}},
      stolen_gold: 0,
      hole: {{hole}},
      mode: '',
      winning: false,
      update: false
   }"
   x-init="$watch('gold_taken', (gold_taken, last_taken) => {
      if (gold - gold_taken < 0 && last_taken < gold_taken)
         abuso--;
      else if (gold - gold_taken <= 0 && last_taken > gold_taken)
         abuso++;
   })"
>


<h2 x-text="`staked gold: ${stakes - stolen_gold} [dg]`"></h2>
<h2 x-text="`gold in The Hole: ${hole} [dg]`"></h2>
<h2 x-text="`${player}'s gold: ${gold - gold_taken} [dg]`"></h2>
<h2 x-text="`${player}'s debt: ${deuda} [dg]`"></h2>

<button @click="mode = 'give to a player'">
   give to a player
</button>
<button @click="mode = 'pay to stakes'">
   pay to stakes
</button>
<button @click="mode = 'steal from stakes'">
   steal from stakes
</button>
<button class="update" x-show="update" @click="window.location.reload()" x-cloak x-transition>
   RELOAD
</button>

<div x-show="mode" x-cloak x-transition>
   <h3 x-text="`how much gold to ${mode}?`"></h3>

   <div class="input" x-show="mode != 'steal from stakes'">
      Gold:
      <span x-text="gold_taken"></span>
      <button class="movit" @click="gold_taken > 0? gold_taken--: null">-1</button>
      <button class="movit" @click="gold_taken++">+1</button>

      <div x-show="mode == 'give to a player'">
         Player: <input type="text" list="jugadores" x-model="player2">
         <datalist id="jugadores">
            <template x-for="option in players">
            <option :value="option"></option>
            </template>
         </datalist>
      </div>
   </div>

   <div class="input" x-show="mode == 'steal from stakes'">
      Gold:
      <span x-text="stolen_gold"></span>
      <button class="movit" @click="stolen_gold > 0? stolen_gold--: null">-1</button>
      <button class="movit" @click="stolen_gold < stakes? stolen_gold++: null">+1</button>
   </div>

   <button @click="
      if (mode == 'give to a player')
         console.log(await send_coins(mode, gold_taken, abuso, player, player2));
      else if (mode == 'pay to stakes')
         console.log(await send_coins(mode, gold_taken, abuso, player));
      else if (mode == 'steal from stakes')
         console.log(await send_coins(mode, stolen_gold, abuso, player));
      console.log(mode);
      gold -= gold_taken;
      if (gold < 0) gold = 0;
      gold += stolen_gold;
      stakes -= stolen_gold;
      gold_taken = 0;
      $nextTick(() => abuso = 0);
      stolen_gold = 0;
      player2 = '';
      mode = '';
      update = true;
   ">GO</button>
</div>

<br><br>
<button @click="winning = !winning">claim the stakes!</button>

<div x-show="winning">
   <button @click="console.log(await claim_staked(player))">confirm</button>
</div>


</body>
</html>
