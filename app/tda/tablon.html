<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>contador qlcsmlawia</title>
   <script src="a.js"></script>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
   <script>
      const module_path = '{{module_path}}';
   </script>
</head>
<body
   x-data="{ players: {{!jugadores}}, stakes: {{stakes}}, hole: {{hole}}, end: false }"
   x-init="
      0;
      for (let player in players) {
         if (players[player].gold < 0)
            end = true;
      }
   "
>

<style>
   .players {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      background: wheat;
      max-width: 301px;
      min-height: 70vh;
      div {
         line-height: 3rem;
      }
      margin: auto;
   }
   .player {
      display: flex;
      justify-content: space-between;
      margin: auto;
      width: 50%;
   }
</style>

<!--! TABLA -->
<h2>Staked: <span x-text="stakes"></span> [dg]</h2>
<h2>The Hole: <span x-text="hole"></span> [dg]</h2>
<h2>Tablon<span x-show="end"> (Game finished!)</span>:</h2>
<div class="player headers">
   <span>Player</span>
   <span>Hoard</span>
   <span>Debt</span>
</div>
<div class="players">
   <template x-for="info, player in players">
   <div class="player">
      <a :href="`tabla/${player}`" x-text="`${player}:`"></a>
      <span x-text="`${info.gold} dg`"></span>
      <span x-text="`${info.debt} dg`"></span>
   </div>
   </template>
</div>

</body>
</html>
