<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>contador qlcsmlawia</title>
   <script src="{{module_path}}/a.js"></script>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
   <script>
      const module_path = '{{module_path}}';
   </script>
</head>
<body x-data="{ players: [], gold: 0}">

<div x-data="{ persona: '' }">
   add people:
   <input
      id="nombrs"
      type="text"
      placeholder="pete"
      x-model="persona"
      @keydown.enter="
         if (persona.replaceAll(' ', '') != '')
            players.push(persona.replaceAll(' ', ''));
         persona = '';
         nombrs.focus();
         $dispatch('restake');
      "
   >
   <button @click="
      if (persona.replaceAll(' ', '') != '')
         players.push(persona.replaceAll(' ', ''));
      persona = '';
      nombrs.focus();
      $dispatch('restake');
   ">ADD</button>
</div>

group gold:
<input
   type="number"
   x-model="gold"
   @change="gold = parseInt(gold)"
   @restake.window="
      gold = 0;
      for (let asdf of players) gold = 10*players.length**2;
   "
><br>

<button @click="registre_players(players, gold)">
   send info to server
</button>

<br>
peopel:
<ol>
   <template x-for="persona, id in players">
   <li>
      <span x-text="`${persona} - ${gold/players.length} dg`"></span>
      <button :id="id" @click="players.splice(id, 1)">DEL</button>
   </li>
   </template>
</ul>

</body>
</html>
